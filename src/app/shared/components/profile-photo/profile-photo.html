<div class="profile-photo" [style.width.px]="size()" [style.height.px]="size()">
  @if (src()) {
    <img [ngSrc]="src()" [alt]="alt()" fill/>
  } @else {
    <span class="placeholder" aria-hidden="true"></span>
  }
</div>
