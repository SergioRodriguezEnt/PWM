<aside class="side-bar">
  <div id="side-bar-top">
    <a routerLink="/" class="side-btn brand" routerLinkActive="active" aria-label="Outfitera" [routerLinkActiveOptions]="{ exact: true }">
      <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 11 V7 Q12 5 10 5"/>
        <path d="M3 19 L12 11 L21 19 Z"/>
      </svg>
      <span class="label">Outfitera</span>
    </a>
  </div>

  <div id="side-bar-center">
    <a routerLink="/search" class="side-btn" routerLinkActive="active">
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <span class="label">Buscar</span>
    </a>

    <a routerLink="/upload" class="side-btn" routerLinkActive="active">
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <span class="label">Subir</span>
    </a>

    <button type="button" class="side-btn notif-btn" (click)="toggleNotifications()">
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="label">Notificaciones</span>
      @if (hasNotifications()) {
        <span class="badge" aria-label="You have notifications"></span>
      }
    </button>

    <a routerLink="/favorites" class="side-btn" routerLinkActive="active">
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
      <span class="label">Favoritos</span>
    </a>

    @if (canEdit() && editLink(); as link) {
      <a [routerLink]="link" class="side-btn">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
        <span class="label">Editar</span>
      </a>
    }
  </div>

  <div id="side-bar-bottom">
    <button type="button" class="side-btn logout" (click)="logout()">
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span class="label">Salir</span>
    </button>
  </div>
</aside>

@if (showNotifications()) {
  <div class="modal-backdrop" (click)="closeNotifications()"></div>

  <div class="notifications-popup" role="dialog" aria-label="Notifications">
    <header class="popup-header">
      <h3>Notificaciones</h3>
      <button type="button" class="close-btn" (click)="closeNotifications()" aria-label="Close">
        ×
      </button>
    </header>

    <ul class="notifications-list">
      @for (n of notifications(); track n.id) {
        <li class="notification">
          <button type="button" class="notification-btn" (click)="openNotification(n)">
            {{ n.message }}
          </button>
        </li>
      } @empty {
        <li class="empty">No hay notificaciones.</li>
      }
    </ul>

    <footer class="popup-footer">
      <button type="button" class="btn" (click)="clearAll()" [disabled]="!hasNotifications()">
        Limpiar todas
      </button>
    </footer>
  </div>
}
