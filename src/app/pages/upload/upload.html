<section class="upload-page">
  <h1>{{ isEdit() ? 'Editar outfit' : 'Subir outfit' }}</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" class="upload-form" novalidate>
    <div class="preview">
      @if (preview()) {
        <img [ngSrc]="preview()" alt="Outfit preview" fill/>
      } @else {
        <div class="placeholder" aria-hidden="true"></div>
      }
    </div>

    <label class="field">
      <span class="field-label">URL del outfit</span>
      <input type="url" formControlName="src" placeholder="https://..." />
    </label>

    <label class="field">
      <span class="field-label">Título</span>
      <input type="text" formControlName="title" />
    </label>

    <label class="field">
      <span class="field-label">Descripción</span>
      <textarea formControlName="description" rows="4"></textarea>
    </label>

    <div class="field tag-field">
      <span class="field-label">Tags</span>
      <div class="chips">
        @for (t of tags(); track t) {
          <span class="chip">
            {{ t }}
            <button type="button" class="chip-remove" (click)="removeTag(t)" aria-label="Eliminar tag">
              ×
            </button>
          </span>
        }
        <input type="text"
          class="chip-input"
          [value]="tagInput()"
          (input)="onTagInput($event)"
          (keydown)="onTagKey($event)"
          (blur)="addTagFromInput()"
          placeholder="Añade una tag y presiona Enter"
        />
      </div>
    </div>

    @if (error(); as err) {
      <p class="error">{{ err }}</p>
    }

    <button type="submit" class="btn btn-primary" [disabled]="saving() || form.invalid">
      {{ saving() ? 'Guardando...' : isEdit() ? 'Guardar cambios' : 'Subir' }}
    </button>
  </form>
</section>
