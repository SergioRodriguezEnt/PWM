<section class="auth-page">
  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>Registro</h1>

    <label class="field">
      <span class="field-label">Nombre de usuario</span>
      <input type="text" formControlName="name" autocomplete="username" placeholder="UnNombreCualquiera" />
    </label>
    <!-- TODO Actively notify user when field is invalid -->

    <label class="field">
      <span class="field-label">Email</span>
      <input type="email" formControlName="email" autocomplete="email" placeholder="aaaaa@example.com"/>
    </label>
    <!-- TODO Actively notify user when field is invalid -->

    <label class="field">
      <span class="field-label">Contraseña</span>
      <input type="password" formControlName="password" autocomplete="new-password" placeholder="**********"/>
    </label>
    <!-- TODO Actively notify user when field is invalid -->

    <label class="field">
      <span class="field-label">Confirmación de la contraseña</span>
      <input type="password" formControlName="confirmPassword" autocomplete="new-password" placeholder="**********"/>
    </label>
    <!-- TODO Actively notify user when field is invalid -->

    @if (form.errors?.['passwordsMismatch'] && form.get('confirmPassword')?.touched) {
      <p class="error">Las contraseñas no coinciden.</p>
    }

    @if (error(); as err) {
      <p class="error">{{ err }}</p>
    }

    <button type="submit" class="btn btn-primary" [disabled]="loading()">
      {{ loading() ? 'Cargando...' : 'Regístrate' }}
    </button>

    <p class="alt-action">
      ¿Ya tienes una cuenta? <a routerLink="login">Inicia sesión</a>
    </p>
  </form>
</section>
