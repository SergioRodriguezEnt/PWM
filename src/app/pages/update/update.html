<div id="profile-form">
  <header class="profile-form-header">
    <h1 class="profile-form-h1"></h1>
  </header>

  <section class="profile-form-section">
    <button id="photo-btn" class="profile-form-btn">
      <img alt="" class="profile-form-img" src="" />
    </button>
  </section>

  <form class="profile-form-form">
    <div id="username-field" class="template-form-text-field"></div>

    <div id="password-field" class="template-form-text-field"></div>

    <div id="description-field" class="template-form-text-field"></div>
  </form>

  <footer class="profile-form-footer">
    <button id="cancel-btn" class="profile-form-btn"></button>

    <button id="save-btn" class="profile-form-btn"></button>
  </footer>
</div>
