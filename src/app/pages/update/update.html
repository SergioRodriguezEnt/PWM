<section class="update-page">
  <h1>Editar perfil</h1>

  @if (loading()) {
    <p class="loading">Cargando...</p>
  } @else {
    <form [formGroup]="form" (ngSubmit)="save()" class="update-form" novalidate>
      <div class="preview">
        <profile-photo [src]="profilePreview()" [size]="120" />
        <span class="hint">Copia la URL de una imagen debajo para visualizarla.</span>
      </div>

      <label class="field">
        <span class="field-label">URL de la foto de perfil</span>
        <input type="url" formControlName="profileSrc" placeholder="https://..." />
      </label>

      <label class="field">
        <span class="field-label">Nombre de usuario</span>
        <input type="text" formControlName="name" />
      </label>

      <label class="field">
        <span class="field-label">Descripción</span>
        <textarea formControlName="description" rows="4"></textarea>
      </label>

      @if (error(); as err) {
        <p class="error">{{ err }}</p>
      }

      <div class="actions">
        <button type="submit" class="btn btn-primary" [disabled]="saving() || form.invalid">
          {{ saving() ? 'Guardando...' : 'Guardar' }}
        </button>
        <button type="button" class="btn" (click)="cancel()" [disabled]="fromRegister()">
          Cancelar
        </button>
      </div>
    </form>
  }
</section>
