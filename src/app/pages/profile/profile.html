
@if (user(); as u) {
  <section class="profile-page">
    <header class="profile-header">
      <profile-photo [src]="u.profileSrc" [size]="120" [alt]="u.name" />
      <div class="profile-meta">
        <h1>{{ u.name }}</h1>
        @if (u.description) {
          <p class="description">{{ u.description }}</p>
        }
      </div>
    </header>

    <h2>Outfits</h2>
    <search-results [outfits]="outfits()" />
  </section>
} @else {
  <p class="loading">Cargando perfil...</p>
}
