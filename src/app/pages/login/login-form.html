<div id="login-form">
  <h1 id="login-title">Iniciar sesión</h1>
  <form>
    <div id="user-field">
      <form-text-field
        label="Email"
        type="email"
        placeholder="Tu email"
        [(value)]="parent.email"
      />
    </div>

    <div id="password-field">
      <form-text-field
        label="Contraseña"
        type="password"
        placeholder="Tu contraseña"
        [(value)]="parent.password"
      />
    </div>

    <p *ngIf="parent.errorMsg">{{ parent.errorMsg }}</p>
    <button id="login-btn" type="button" (click)="parent.onLogin()">
      Iniciar sesión
    </button>
  </form>
</div>
