<section class="search-page">
  <div class="section-header">
    <search-bar [initial]="initialQuery()" (search)="onSearch($event)"/>
    @if (isLoggedIn()) {
      <profile-photo [src]="profileSrc()" [alt]="profileName()" [userId]="profileId()" [size]="48"/>
    }
  </div>
  <search-results [outfits]="results()"/>
</section>
